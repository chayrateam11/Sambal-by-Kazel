<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pesanan Saya - Sambal by Kazel</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Riwayat pesanan kuliner Sambal by Kazel tanpa perlu login. Lacak status pesanan dan pesan kembali varian favorit dalam 1 klik.">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  
  <!-- Google Fonts: Plus Jakarta Sans & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- Tailwind CSS via CDN & External Custom Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/tailwind.config.js"></script>
  
  <!-- Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-background text-on-surface flex flex-col min-h-screen antialiased selection:bg-primary-fixed selection:text-primary">

  <!-- Header Component (Ticker & Navigation) -->
  <app-header active="pesanan"></app-header>

  <!-- MAIN RIWAYAT CONTENT -->
  <main class="flex-grow py-6 sm:py-10">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Breadcrumb Navigation -->
      <nav class="flex items-center gap-2 text-xs font-semibold text-on-surface-variant mb-6">
        <a href="/" class="hover:text-primary transition-colors">Beranda</a>
        <span class="material-symbols-outlined text-xs">chevron_right</span>
        <span class="text-primary font-bold">Riwayat Pesanan</span>
      </nav>

      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-on-surface tracking-tight">Riwayat Pesanan Saya</h1>
        </div>

        <div class="flex items-center gap-2">
          <a href="/katalog" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-xs font-bold text-white bg-primary hover:bg-primary-container shadow-sm transition-all tap-target">
            <span class="material-symbols-outlined text-base">add_shopping_cart</span>
            <span>Belanja Lagi</span>
          </a>
        </div>
      </div>

      <!-- Container Riwayat Pesanan -->
      <div id="ordersContainer" class="space-y-6">
        <!-- Will be dynamically populated by JS -->
      </div>

    </div>
  </main>

  <!-- Footer Component -->
  <app-footer></app-footer>

  <!-- Centralized Script -->
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/pages/history.js"></script>
</body>
</html>
